- name: Computer Language
  major: ITM
  semester: Spring
  description: Introduction to problem solving with programming, progressing from basic concepts to advanced object-oriented techniques in Java.

- name: Web Programming
  major: ITM
  semester: Spring
  description: Introduction to the foundations of web development, covering core principles of web technologies, interactive design, and application deployment.

- name: Business Process Management
  major: ITM
  semester: Fall
  description: Provides an understanding of BPM concepts and methods, enabling students to model, analyze, and improve organizational processes using BPMN and process mining.

- name: Opensource Software
  major: ITM
  semester: Fall
  description: Explores the philosophy, practices, and tools of open source development, preparing students to contribute to and manage OSS projects effectively.

- name: Business Analytics
  major: Data Science
  semester: Spring
  description: Introduces process mining techniques and tools to analyze, monitor, and improve business processes using real-world datasets.

- name: Data Analysis for Electronic Manufacturing
  major: Data Science
  semester: Fall
  description: Introduces the methods and phases of a complete data science project in electronic manufacturing, guiding students from data cleaning and understanding through modeling and evaluation.
