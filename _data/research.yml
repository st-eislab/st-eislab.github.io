- id: wind-power-forecasting
  title: Wind Power Generation Forecasting
  direction: sustainable-energy-intelligence
  status: active
  public: true
  summary: Multi-site wind-power forecasting that examines how inputs and modeling choices affect
    reliability and operational usefulness.
  description: >-
    This collaborative research investigates wind-power forecasting across multiple
    sites and future time steps, with applications to wind farms in Guatemala. We
    examine how historical generation, meteorological information, and modeling
    choices influence forecast reliability. The aim is to connect predictive
    performance with practical needs in wind-farm operation and planning, assessing
    the usefulness of forecasts across different horizons.
