# EIS Lab research database
#
# `directions` define the stable research identity of the lab.
# Set `homepage: true` for the three cards shown on the landing page.
#
# `topics` are concrete active/emerging research lines. Optional links are omitted
# automatically when blank. Set `public: false` to keep a topic in this file
# without publishing it on the website.

directions:
- id: explainable-human-centered-ai
  title: Explainable & Human-Centered AI
  homepage: true
  icon: bi-lightbulb
  style: primary
  summary: Interpretable AI that combines probabilistic rule extraction, symbolic representations, and
    agentic explanation generation for understandable decision support.
  intro: Our methodological core focuses on AI systems whose decisions can be inspected and communicated.
    Current work includes probabilistic rule extraction from tree ensembles and agentic explanation generation,
    with an emphasis on useful, grounded explanations.

- id: smart-manufacturing-intelligence
  title: Intelligent & Explainable Smart Manufacturing
  homepage: true
  icon: bi-gear-wide-connected
  style: accent
  summary: Predictive and explainable AI for manufacturing quality and decision support, including grounded
    natural-language explanations.
  intro: We develop AI methods for manufacturing systems, especially quality prediction and explanation.
    Current work combines symbolic representations and language models to produce grounded explanations
    for manufacturing decisions.

- id: sustainable-energy-intelligence
  title: Sustainable Energy Intelligence
  homepage: true
  icon: bi-sun
  style: neutral
  summary: Battery health estimation and multimodal renewable-power forecasting for reliable, data-driven
    energy systems.
  intro: We apply machine learning to renewable-energy forecasting and energy-storage diagnostics. Current
    work includes battery state-of-health estimation from EIS, multimodal solar-power forecasting, and
    wind-power generation forecasting.

- id: process-mining-process-intelligence
  title: Process Mining & Process Intelligence
  homepage: false
  icon: bi-diagram-3
  style: process
  summary: Event-data analytics and process mining for understanding IoT-enabled manufacturing processes
    and supporting process-aware decisions.
  intro: We investigate how event data from connected industrial systems can reveal process behavior,
    deviations, and opportunities for better monitoring and decision support.

- id: graph-learning-explainability
  title: Graph Learning & Explainability
  homepage: false
  icon: bi-share
  style: graph
  summary: Dynamic graph representation learning and explainability for evolving graph-structured data.
  intro: We study learning from dynamic temporal graphs and methods that make graph neural models more
    interpretable. Current work includes DYGLA and an emerging XAI-for-GNN research line.

topics:
- id: probabilistic-rule-extraction
  title: Probabilistic Rule Extraction from Tree Ensembles
  direction: explainable-human-centered-ai
  status: active
  public: true
  summary: Compact probabilistic rules that preserve useful predictive information from complex tree ensembles
    while improving interpretability and confidence awareness.
  description: This line of research extends rule extraction from tree ensembles toward probabilistic
    and calibrated symbolic models. The objective is to preserve useful predictive behavior while producing
    compact rules whose confidence can be interpreted and assessed.
  image: assets/img/research/rule-extraction.png
