  title: TRACE — Agentic Explanation Generation
  direction: explainable-human-centered-ai
  status: active
  public: true
  summary: Agentic generation and assessment of natural-language explanations grounded in symbolic rules,
    domain knowledge, and user context.
  description: >-
    TRACE investigates how AI agents can generate and assess natural-language explanations
    for manufacturing quality predictions. The research combines symbolic rules with
    relevant domain knowledge and user context to address different explanation needs.
    The goal is to produce explanations that remain consistent with predictive evidence
    and are useful to users with different responsibilities and levels of technical expertise.
