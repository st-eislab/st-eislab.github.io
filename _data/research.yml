- id: dygla
  title: DYGLA — Dynamic Graph Learning Representation
  direction: graph-learning-explainability
  status: active
  public: true
  summary: Representation learning for evolving graphs to support tasks such as link prediction
    and node classification.
  description: >-
    DYGLA investigates representation learning for graphs whose interactions and
    relational structure evolve over time. The research focuses on capturing
    connectivity and temporal information to support downstream tasks such as
    link prediction and node classification. The goal is to learn representations
    that account for changing relationships and interaction histories, supporting
    prediction in dynamic graph settings.
  image: assets/img/research/dygla.png
  image_alt: Conceptual placeholder for dynamic graph learning
  keywords:
  - dynamic graphs
  - temporal graphs
  - representation learning
  - graph neural networks
