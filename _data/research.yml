- id: industrial-iot-process-mining
  title: Process Mining for Industrial IoT
  direction: process-mining-process-intelligence
  status: active
  public: true
  summary: Exploratory research on process mining and counterfactual explanations for understanding
    industrial processes and investigating undesirable outcomes.
  description: >-
    This emerging research explores process mining and counterfactual explanations
    for industrial IoT and smart manufacturing. We investigate how event and sensor
    information can help users understand process behavior, examine undesirable
    outcomes, and explore alternative scenarios. The goal is to support root-cause
    investigation and process improvement through explanations that connect observed
    outcomes with the processes in which they occur.
