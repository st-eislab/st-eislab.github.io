  project_url: null

- id: xai-for-gnns
  title: Explainable AI for Graph Neural Networks
  direction: graph-learning-explainability
  status: emerging
  public: true
  summary: Emerging research on explaining how graph neural networks use neighborhood information
    to make predictions.
  description: >-
    This emerging research explores how predictions from graph neural networks can
    be understood through the surrounding graph information they use. We investigate
    the relevance of different neighborhoods and the extent of information
    propagation needed for a prediction. The goal is to make graph-based learning
    more interpretable by explaining which relational information matters and why
    it is useful.
  image: assets/img/research/gnn-xai.png
