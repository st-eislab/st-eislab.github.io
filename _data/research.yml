- id: battery-soh-partial-charge-eis
  title: Battery SOH Estimation from Partial-Charge EIS
  direction: sustainable-energy-intelligence
  status: active
  public: true
  summary: Battery health estimation from partial-charge impedance measurements by combining
    physical knowledge with data-driven learning.
  description: >-
    We investigate battery state-of-health estimation from electrochemical impedance
    spectroscopy (EIS) measurements collected under partial-charge conditions. The
    research combines physical knowledge with data-driven learning to support health
    assessment when full-charge measurements are unavailable. Building on the lab's
    earlier EIS-based work, we examine the reliability of estimation across different
    charging conditions and the value of incorporating physical information into
    predictive models.
  image: assets/img/research/soh-pinn.png
  image_alt: Battery state-of-health estimation from impedance data
  keywords:
  - battery SOH
  - EIS
  - partial charging
  - battery diagnostics
  paper: null
  doi: null
  preprint: null
  code: null
  dataset: null
  project_url: null

- id: multimodal-pv-forecasting
  title: Multimodal Solar Power Forecasting
  direction: sustainable-energy-intelligence
  status: active
  public: true
  summary: Photovoltaic power forecasting that combines historical generation data, satellite
    observations, and ground-based sky imagery.
  description: >-
    We investigate photovoltaic power forecasting using historical generation data,
    satellite observations, and ground-based sky imagery. These complementary sources
    provide information about power-generation patterns and atmospheric conditions
    at different spatial scales. The research explores how combining these modalities
    can help anticipate changes in solar-power output and examines their contribution
    to forecasting performance under varying cloud and irradiance conditions.
  image: assets/img/research/multi-modal-pv-forecasting.png
  image_alt: Multimodal solar power forecasting
