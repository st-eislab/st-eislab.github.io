- id: ruleslm
  title: RuleSLM — Grounded Natural-Language Explanations for Manufacturing Quality Prediction
  direction: smart-manufacturing-intelligence
  status: active
  public: true
  summary: Small language models that use symbolic rules and contextual information to explain
    manufacturing quality predictions in natural language.
  description: >-
    RuleSLM investigates how small language models can communicate symbolic rules as
    natural-language explanations of manufacturing quality predictions. We examine
    how contextual knowledge and behavioral guidance influence the quality of the
    generated explanations. The aim is to connect the inspectability of rule-based
    models with accessible explanations, helping users understand predictions while
    retaining a clear connection to the supporting rules.
  image: assets/img/research/ruleslm.png
  image_alt: Rule-grounded natural-language explanations for manufacturing quality prediction
